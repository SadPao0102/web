<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pool Pro | Thanyathep</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;500&display=swap" rel="stylesheet">
</head>
<body class="pool-page">
    <header class="main-navbar-wrapper1">
        <nav class="cv-navbar1">
            <a href="index.html">🏠 Home</a>
            <a href="cv.html">👤 About</a>
            <a href="js-page.html">🏀 Chalke</a>
            <a href="js-page2.html">🏀 KhaeSad</a>
            <a href="game.html" class="cv-active">🎱 Play Pool</a>
        </nav>
    </header>

    <div class="game-container">
        <h1 style="font-family: 'Bebas Neue', sans-serif; font-size: 3rem; letter-spacing: 3px;">🎱 POOL 8 BALL</h1>

        <div class="hud">
            <div>NEXT TURN: <span id="turn" style="color:#ffcc00">PLAYER</span></div>
        </div>

        <div class="canvas-wrapper">
            <canvas id="game" width="900" height="450"></canvas>
        </div>

        <button class="btn-reset" onclick="resetGame()" style="margin: 20px 0;">🔄 RESTART GAME</button>

        <section class="instructions">
            <div class="instruction-grid">
                <div class="inst-card">
                    <span class="icon">🖱️</span>
                    <h4>Desktop</h4>
                    <p>คลิกซ้ายค้างที่ลูกขาว ลากสวนทางเพื่อเล็งและปล่อยเพื่อยิง</p>
                </div>
                <div class="inst-card">
                    <span class="icon">📱</span>
                    <h4>Mobile</h4>
                    <p>ใช้นิ้วแตะที่ลูกขาวแล้วลากเพื่อกำหนดทิศทางและแรงยิง</p>
                </div>
                <div class="inst-card">
                    <span class="icon">🏆</span>
                    <h4>Goal</h4>
                    <p>แทงลูกสีตัวเองให้หมด แล้วปิดด้วยลูกดำหมายเลข 8 เพื่อชนะ</p>
                </div>
            </div>
        </section>
    </div>

    <script src="js/game.js"></script>
</body>
